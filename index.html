<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E3EFE5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kerala '26">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Nine days by road: Madurai, Munnar, the Alleppey backwaters and Kochi. 24 October to 1 November 2026.">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="referrer" content="no-referrer">
<title>Kerala by road</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --mint:#E3EFE5;
  --mint-2:#D3E6D6;
  --paper:#FFFFFF;
  --cream:#FDF7EC;
  --ink:#1F2D26;
  --muted:#6C7F73;
  --line:#DCE7DC;
  --mango:#F7A82B;
  --mango-d:#E09118;
  --coral:#FB7A5C;
  --leaf:#58B368;
  --sky:#6FBEE4;
  --grape:#8B7BE8;
  --rose:#F2708F;
  --display:"Baloo 2",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,sans-serif;
  --r:26px;
  --r-sm:18px;
  --sh:0 6px 18px rgba(31,45,38,.09);
  --sh-lg:0 12px 30px rgba(31,45,38,.13);
  --tab:66px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--mint);color:var(--ink);
  font:400 16px/1.6 var(--body);-webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--tab) + env(safe-area-inset-bottom) + 26px);
  -webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(90% 42% at 50% 0%,#F0F8F1,transparent 70%);
}
h1,h2,h3,p,ol,ul,dl,dt,dd,figure{margin:0}
ol,ul{padding:0;list-style:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
a{color:inherit}
img,svg{display:block}
:focus-visible{outline:3px solid var(--mango);outline-offset:3px;border-radius:10px}
.wrap{max-width:600px;margin:0 auto;padding:0 16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}

/* ---------- greeting ---------- */
.hi{padding:calc(env(safe-area-inset-top) + 18px) 0 0}
.hi .wrap{display:flex;align-items:center;gap:12px}
.hi h1{font:800 25px/1.2 var(--display);flex:1}
.hi h1 small{display:block;font:600 13.5px/1.4 var(--body);color:var(--muted);margin-top:3px}
.avatar{
  flex:none;width:52px;height:52px;border-radius:50%;background:var(--mango);color:#fff;
  display:grid;place-content:center;text-align:center;box-shadow:var(--sh);
}
.avatar b{font:800 19px/1 var(--display)}
.avatar small{display:block;font:700 8.5px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;opacity:.9;margin-top:2px}

/* ---------- rail ---------- */
.rail{position:sticky;top:0;z-index:40;background:rgba(227,239,229,.9);
  backdrop-filter:saturate(160%) blur(12px);-webkit-backdrop-filter:saturate(160%) blur(12px);
  padding-top:env(safe-area-inset-top)}
.rail-in{display:flex;gap:9px;overflow-x:auto;scrollbar-width:none;padding:12px 16px;max-width:600px;margin:0 auto}
.rail-in::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;padding:9px 15px;border-radius:999px;background:var(--paper);
  box-shadow:var(--sh);text-align:center;min-width:60px;transition:transform .15s;
}
.chip small{display:block;font:700 10.5px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.chip b{display:block;font:800 18px/1.2 var(--display);margin-top:2px}
.chip[aria-current="true"]{background:var(--c);box-shadow:0 6px 16px color-mix(in srgb,var(--c) 45%,transparent);transform:translateY(-2px)}
.chip[aria-current="true"] small,.chip[aria-current="true"] b{color:#fff}
.chip.done:after{content:"";display:block;width:6px;height:6px;border-radius:50%;background:var(--leaf);margin:3px auto 0}
.chip[aria-current="true"].done:after{background:#fff}

/* ---------- postcard ---------- */
.post{position:relative;background:var(--paper);border-radius:var(--r);box-shadow:var(--sh-lg);
  padding:10px 10px 16px;margin-top:6px;overflow:hidden}
.post-art{position:relative;border-radius:var(--r-sm);overflow:hidden;aspect-ratio:16/10;background:#CFE9F5}
.post-art svg{width:100%;height:100%}
.post-num{
  position:absolute;top:16px;right:16px;z-index:2;background:var(--paper);color:var(--c);
  font:800 15px/1 var(--display);padding:8px 12px;border-radius:999px;box-shadow:var(--sh);
}
.post-bd{padding:15px 8px 0}
.post h2{font:800 27px/1.16 var(--display);letter-spacing:-.005em}
.post-hand{font:700 13.5px/1.4 var(--body);color:var(--c);letter-spacing:.02em}
.pill{
  display:inline-block;vertical-align:4px;margin-left:8px;background:var(--coral);color:#fff;
  border-radius:999px;font:800 11px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;padding:6px 10px;
}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.facts>div{background:var(--cream);border-radius:14px;padding:11px 13px}
.facts dt{font:700 10.5px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  display:flex;align-items:center;gap:5px}
.facts dt:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.facts dd{font:800 15.5px/1.3 var(--display);margin-top:5px}

/* ---------- next stop ---------- */
.next{position:relative;background:var(--paper);border-radius:var(--r);box-shadow:var(--sh-lg);
  padding:18px 18px 17px;margin-top:14px;overflow:hidden}
.next:before{content:"";position:absolute;top:-40px;right:-40px;width:130px;height:130px;border-radius:50%;
  background:color-mix(in srgb,var(--c) 16%,transparent)}
.next-eye svg{width:13px;height:13px;flex:none}
.next-eye{position:relative;display:inline-flex;align-items:center;gap:7px;background:color-mix(in srgb,var(--c) 14%,transparent);
  color:var(--c);font:800 11px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;padding:8px 12px;border-radius:999px}
.next h3{position:relative;font:800 24px/1.18 var(--display);margin-top:11px}
.next p{position:relative;font-size:15.5px;color:var(--muted);margin-top:8px}
.next-act{position:relative;display:flex;gap:10px;margin-top:16px}
.next-then{position:relative;margin-top:15px;padding-top:13px;border-top:1.5px dashed var(--line);font-size:14px;color:var(--muted)}
.next-then b{color:var(--ink);font-weight:800}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;
  border-radius:999px;font:800 15px/1 var(--display);background:var(--cream);color:var(--ink);
  text-decoration:none;box-shadow:var(--sh);transition:transform .12s;
}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--mango);color:#fff;box-shadow:0 8px 20px rgba(247,168,43,.4)}
.btn-leaf{background:var(--leaf);color:#fff;box-shadow:0 8px 20px rgba(88,179,104,.35)}
.btn-quiet{background:transparent;box-shadow:none;color:var(--muted)}
.btn-w{flex:1}
.btn svg{width:18px;height:18px;flex:none}

/* ---------- eyebrow ---------- */
.eye{display:flex;align-items:center;gap:9px;font:800 17px/1.2 var(--display);margin:26px 0 11px}
.eye svg{width:19px;height:19px;flex:none}

/* ---------- rows ---------- */
.rows{background:var(--paper);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.rows>li+li{border-top:1.5px solid var(--line)}
.row{display:grid;grid-template-columns:64px minmax(0,1fr) 32px;gap:12px;align-items:center;width:100%;padding:15px 16px;transition:background .15s}
.row:active{background:var(--cream)}
.row-time{font:700 13.5px/1.3 var(--body);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.row-nm{font:700 15.5px/1.35 var(--body);min-width:0}
.row-sub{display:block;font:600 12.5px/1.4 var(--body);color:var(--muted);margin-top:4px}
.row-mk{justify-self:end;width:30px;height:30px;border-radius:50%;background:var(--cream);display:grid;place-content:center;color:#C9D6CC}
.row-mk svg{width:14px;height:14px}
.row.is-next .row-mk{background:var(--c);color:#fff;box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 20%,transparent)}
.row.is-next .row-nm{font-weight:800}
.row.done .row-mk{background:var(--leaf);color:#fff}
.row.done .row-nm{color:var(--muted);font-weight:600}
.row.done .row-time{color:var(--leaf);font-weight:800}
.row.hoff .row-nm{color:#A8B8AC;text-decoration:line-through}
.row-opt .row-nm:after{content:"maybe";display:inline-block;font:800 9.5px/1 var(--body);letter-spacing:.08em;
  text-transform:uppercase;color:var(--grape);background:#F0EDFD;border-radius:999px;padding:4px 7px;margin-left:9px;vertical-align:2px}

/* ---------- car ---------- */
.car-card{background:linear-gradient(170deg,#EAF7FC,#CFE8F2);border-radius:var(--r);box-shadow:var(--sh);
  padding:14px 16px 16px;margin-top:6px;overflow:hidden}
.car-head{display:flex;align-items:center;gap:10px}
.car-head h3{font:800 20px/1.2 var(--display);flex:1}
.car-head span{font:700 11.5px/1.35 var(--body);color:var(--muted);text-align:right}
.stage3d{position:relative;height:238px;margin:2px 0 0;border-radius:18px;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 8%,#f4fbfd,#cfe8f2)}
.stage3d canvas{width:100%;height:100%;display:block;touch-action:pan-y;cursor:grab}
.car-load{position:absolute;inset:0;display:grid;place-content:center;text-align:center;
  font:700 13.5px/1.5 var(--body);color:var(--muted);padding:0 20px}
.car-hint{text-align:center;font:700 12.5px/1.4 var(--body);color:var(--muted);margin-top:2px}
.swatches{display:flex;gap:11px;justify-content:center;margin-top:12px}
.swatch{width:31px;height:31px;border-radius:50%;background:var(--s);transition:transform .15s;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.85),0 2px 6px rgba(31,45,38,.2)}
.swatch[aria-pressed="true"]{transform:scale(1.2);box-shadow:0 0 0 3px var(--mango),0 2px 8px rgba(31,45,38,.22)}
.specs{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}
.specs>div{background:rgba(255,255,255,.74);border-radius:14px;padding:11px 8px;text-align:center}
.specs dt{font:700 10px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.specs dd{font:800 14.5px/1.3 var(--display);margin-top:6px}

/* ---------- disclosure ---------- */
.acc{margin-top:12px;background:var(--paper);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.acc>summary{display:flex;align-items:center;gap:10px;padding:16px;cursor:pointer;list-style:none;
  font:800 16px/1.3 var(--display)}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary svg{width:21px;height:21px;flex:none;color:var(--c,var(--mango))}
.acc>summary .chev{margin-left:auto;width:26px;height:26px;border-radius:50%;background:var(--cream);
  display:grid;place-content:center;transition:transform .2s;color:var(--muted)}
.acc>summary .chev svg{width:13px;height:13px}
.acc[open]>summary .chev{transform:rotate(180deg)}
.acc-bd{padding:0 16px 16px}
.tl li{display:grid;grid-template-columns:66px minmax(0,1fr);gap:12px;padding:11px 0;border-top:1.5px solid var(--line)}
.tl li:first-child{border-top:0}
.tl time{font:800 13px/1.5 var(--body);color:var(--c,var(--mango));font-variant-numeric:tabular-nums}
.tl p{font-size:14.5px;color:var(--muted);line-height:1.55}
.tl li.key p{color:var(--ink);font-weight:600}
.tl li.now{background:var(--cream);border-radius:12px;padding-left:10px;padding-right:10px;margin:0 -10px}
.tl li.now time:after{content:"now";display:block;font:800 9.5px/1.4 var(--body);letter-spacing:.08em;text-transform:uppercase}
.tl li.past{opacity:.5}
.note-p{font-size:15px;color:var(--muted);line-height:1.6}
.tips li{position:relative;padding-left:24px;font-size:14.5px;color:var(--muted);line-height:1.55;margin-top:11px}
.tips li:before{content:"•";position:absolute;left:8px;top:-1px;color:var(--coral);font-size:19px;font-weight:800}

/* ---------- route ---------- */
.page-h{font:800 34px/1.1 var(--display);margin-top:20px}
.page-h em{font-style:normal;color:var(--mango)}
.page-lede{color:var(--muted);font-size:15.5px;margin-top:10px}
.stat{display:flex;align-items:center;gap:9px;margin-top:20px;font:800 15px/1.4 var(--display)}
.stat span{color:var(--muted);font-weight:600;font-family:var(--body);font-size:14px}
.bar{height:10px;border-radius:999px;background:var(--paper);box-shadow:inset 0 1px 2px rgba(31,45,38,.06);margin-top:10px;overflow:hidden}
.bar u{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--leaf),var(--mango));width:var(--p,0%)}
.days{background:var(--paper);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.day{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:14px 16px;transition:background .15s}
.day:active{background:var(--cream)}
.day+.day{border-top:1.5px solid var(--line)}
.day-no{display:grid;place-content:center;width:38px;height:38px;border-radius:50%;background:var(--c);color:#fff;font:800 15px/1 var(--display)}
.day-dt{display:block;font:700 10.5px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.day-ti{display:block;font:800 16.5px/1.3 var(--display);margin-top:5px}
.day-sub{display:block;font:600 12.5px/1.4 var(--body);color:var(--muted);margin-top:5px}
.day-km{font:800 13px/1 var(--body);color:var(--muted);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;min-width:56px}
.day-km em{display:block;font:800 11.5px/1.4 var(--body);font-style:normal;color:var(--leaf);margin-top:8px}
.day-km em.zero{color:#B9C7BC}

/* ---------- money ---------- */
.ledger{padding:6px 16px 12px}
.ledger li{display:flex;align-items:baseline;gap:9px;padding:12px 0;border-bottom:1.5px dashed var(--line)}
.ledger li:last-child{border-bottom:0}
.ledger .l{order:1;font-size:15px;color:var(--muted);min-width:0}
.ledger .d{order:2;flex:1;min-width:10px}
.ledger b{order:3;font:800 15px/1.3 var(--display);white-space:nowrap;font-variant-numeric:tabular-nums}
.ledger .tot{margin-top:6px;padding-top:16px;border-top:2.5px solid var(--ink);border-bottom:0}
.ledger .tot .l{font:800 12.5px/1.4 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.ledger .tot b{font:800 24px/1 var(--display);color:var(--mango)}

/* ---------- checklist ---------- */
.chk{padding:4px 16px}
.chk li+li{border-top:1.5px solid var(--line)}
.chk label{display:flex;gap:13px;align-items:flex-start;padding:14px 0;cursor:pointer}
.chk input{appearance:none;-webkit-appearance:none;flex:none;width:26px;height:26px;margin:0;border-radius:9px;
  background:var(--cream);display:grid;place-content:center;cursor:pointer;transition:background .15s}
.chk input:checked{background:var(--leaf)}
.chk input:checked:after{content:"";width:5px;height:10px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-2px)}
.chk span{font-size:15px;color:var(--muted);line-height:1.55}
.chk input:checked+span{color:#A8B8AC;text-decoration:line-through}
.hint{color:var(--muted);font-size:13.5px;line-height:1.6;margin-top:11px}

/* ---------- tabs ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:60;padding-bottom:env(safe-area-inset-bottom);
  background:rgba(255,255,255,.94);backdrop-filter:saturate(160%) blur(14px);-webkit-backdrop-filter:saturate(160%) blur(14px);
  border-top:1.5px solid var(--line)}
.tabs div{display:flex;max-width:600px;margin:0 auto;padding:0 8px}
.tabs button{flex:1;min-height:var(--tab);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  font:800 10.5px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:#A8B8AC;transition:color .15s;position:relative}
.tabs svg{width:23px;height:23px}
.tabs button[aria-selected="true"]{color:var(--mango-d)}
.tabs button[aria-selected="true"]:before{content:"";position:absolute;top:6px;width:52px;height:38px;border-radius:999px;background:#FDF0DA;z-index:-1}

/* ---------- sheet ---------- */
.sheet{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end}
.sheet[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(31,45,38,.42);border:0;padding:0;cursor:default;animation:fade .2s}
.panel{position:relative;width:100%;max-width:600px;margin:0 auto;max-height:90vh;overflow-y:auto;
  background:var(--paper);border-radius:30px 30px 0 0;padding-bottom:calc(env(safe-area-inset-bottom) + 22px);
  animation:rise .3s cubic-bezier(.2,.8,.25,1)}
.grab{width:44px;height:5px;border-radius:999px;background:var(--line);margin:11px auto 0}
.panel figure{margin:14px 0 0;aspect-ratio:16/10;background:var(--cream);overflow:hidden}
.panel figure img{width:100%;height:100%;object-fit:cover}
.panel .cap{font:600 11px/1 var(--body);color:var(--muted);padding:8px 18px 0}
.panel .cap a{text-decoration:underline}
.panel-bd{padding:14px 18px 0}
.panel-bd h2{font:800 25px/1.18 var(--display)}
.pmeta{display:inline-flex;align-items:center;gap:7px;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);
  font:800 11px/1 var(--body);letter-spacing:.07em;text-transform:uppercase;padding:7px 11px;border-radius:999px}
.ptext{font-size:15.5px;color:var(--muted);line-height:1.6;margin-top:11px}
.act{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.marked{font-size:13px;color:var(--leaf);margin-top:14px;font-weight:800}

/* ---------- install hint ---------- */
.hintbar{position:fixed;left:12px;right:12px;bottom:calc(var(--tab) + env(safe-area-inset-bottom) + 12px);z-index:65;
  background:var(--ink);color:#fff;font:600 13.5px/1.45 var(--body);border-radius:18px;box-shadow:var(--sh-lg);
  display:flex;align-items:center;gap:10px;padding:13px 15px;max-width:576px;margin:0 auto}
.hintbar b{font-weight:800;color:var(--mango)}
.hintbar button{margin-left:auto;color:rgba(255,255,255,.6);font:400 21px/1 var(--body);padding:2px 4px}

@keyframes rise{from{transform:translateY(20px);opacity:.5}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.bobbing .car3d{animation:bob 3.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{animation:none!important;transition:none!important}
}
@media (min-width:520px){.facts{grid-template-columns:repeat(4,1fr)}}
@media print{.tabs,.rail,.hintbar,.btn{display:none}body{background:#fff}}
</style>
</head>
<body>

<header class="hi"><div class="wrap">
  <h1 id="greet">Namaskaram<small id="greetsub"></small></h1>
  <div class="avatar"><b id="avnum">5</b><small>day</small></div>
</div></header>

<nav class="rail" aria-label="Choose a day"><div class="rail-in" id="rail"></div></nav>
<main id="view"></main>

<nav class="tabs" role="tablist" aria-label="Sections">
  <div>
    <button role="tab" data-tab="day">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 15.5h16M6.5 12l8-8 3 3-8 8z"/><circle cx="7.5" cy="16.5" r="2"/></svg>
      <span>Today</span></button>
    <button role="tab" data-tab="route">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 19c0-4 6-3 6-7s4-3 6-3"/><circle cx="5" cy="19" r="2.2"/><circle cx="19" cy="8" r="2.2"/></svg>

  const p={};
  new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Kolkata",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"})
    .formatToParts(new Date()).forEach(x=>{p[x.type]=x.value;});
  return {y:+p.year,mo:+p.month,d:+p.day,min:(+p.hour)*60+(+p.minute)};
}
function tripDay(n){
  if(n.y!==2026) return 0;
  if(n.mo===10&&n.d>=24&&n.d<=31) return n.d-23;
  if(n.mo===11&&n.d===1) return 9;
  return 0;
}
function clock(ts){ try{return new Date(ts).toLocaleTimeString("en-IN",{timeZone:"Asia/Kolkata",hour:"numeric",minute:"2-digit",hour12:true}).toUpperCase();}catch(e){return "";} }

function stopsOf(i){
  const D=DAYS[i], st=D.stay;
  const list=D.places.map((p,j)=>({k:i+"."+j,n:p.n,d:p.d,q:p.q,t:p.t||"",w:p.w||"",alt:!!p.alt,rl:p.rl||"Reached"}));
  list.push({k:i+".s",n:st.n,d:st.t,q:S.loc[st.sid]||st.q,t:st.at,w:st.w||"",alt:false,rl:st.rl,stay:st});
  return list.map((s,x)=>({s,x,m:s.t?toMin(s.t):null}))
    .sort((a,b)=>((a.s.alt?1:0)-(b.s.alt?1:0))||((a.m===null?9999:a.m)-(b.m===null?9999:b.m))||(a.x-b.x))
    .map(o=>o.s);
}
const isDone=s=>!!S.got[s.k]||!!S.skip[s.k];
const nextStop=i=>{ const L=stopsOf(i); return L.find(s=>!s.alt&&!isDone(s))||null; };
function dayProg(i){ const L=stopsOf(i).filter(s=>!s.alt); return {d:L.filter(isDone).length,n:L.length}; }
function allProg(){ let d=0,n=0; DAYS.forEach((_,i)=>{const p=dayProg(i); d+=p.d; n+=p.n;}); return {d,n}; }

const IMGK="kerala-trip-2026-photos";
let IMG={}; try{ IMG=JSON.parse(localStorage.getItem(IMGK)||"{}"); }catch(e){}
async function photoFor(w){
  const list=(w||"").split("|").filter(Boolean);
  for(const t of list) if(IMG[t]&&IMG[t].s) return IMG[t];
  const need=list.filter(t=>IMG[t]===undefined);
  if(!need.length) return null;
  try{
    const url="https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&prop=pageimages&piprop=thumbnail&pithumbsize=1200&titles="+encodeURIComponent(need.join("|"));
    const j=await (await fetch(url)).json();
    const norm={},redir={},by={};
    (j.query&&j.query.normalized||[]).forEach(x=>norm[x.from]=x.to);
    (j.query&&j.query.redirects||[]).forEach(x=>redir[x.from]=x.to);
    Object.values(j.query&&j.query.pages||{}).forEach(pg=>{ if(pg.thumbnail&&pg.thumbnail.source) by[pg.title]={s:pg.thumbnail.source,p:pg.title}; });
    need.forEach(t=>{ let x=norm[t]||t; x=redir[x]||x; IMG[t]=by[x]||0; });
    try{ localStorage.setItem(IMGK,JSON.stringify(IMG)); }catch(e){}
  }catch(e){}
  for(const t of list) if(IMG[t]&&IMG[t].s) return IMG[t];
  return null;
}

function nextHtml(i,isToday){
  const D=DAYS[i], nx=nextStop(i), L=stopsOf(i);
  if(!nx){
    const nd=i<DAYS.length-1?stopsOf(i+1).find(s=>!s.alt):null;

      <span class="next-eye">${ICON.star}${i<DAYS.length-1?"day complete":"trip complete"}</span>

      :`<p>Safe travels.</p>`}

  }
  const rest=L.filter(s=>!s.alt&&!isDone(s)&&s.k!==nx.k);
  const alts=L.filter(s=>s.alt&&!isDone(s));
  const started=L.some(s=>!s.alt&&isDone(s));
  const label=isToday||started?"Next stop":"Start here";
  return `<section class="next" style="--c:${D.c}">
    <span class="next-eye">${ICON.pin}${label}${nx.t?` · ${esc(nx.t)}`:""}</span>

    ${alts.length?`<p class="next-then">If there is time: <b>${esc(alts.map(a=>a.n).join(", "))}</b></p>`:""}
  </section>`;
}

function rowHtml(s,i){

      if(!box||!ph||openKey!==k) return;
      box.innerHTML=`<figure><img src="${ph.s}" alt="${esc(s.n)}"></figure>
        <p class="cap">Photo: <a href="https://en.wikipedia.org/wiki/${encodeURIComponent(ph.p.replace(/ /g,"_"))}" target="_blank" rel="noopener">Wikipedia</a></p>`;
    });
  }
}
function closeSheet(){
  const el=$("#sheet");
  if(el.hidden) return;
  el.hidden=true; el.innerHTML=""; openKey=null;
  document.body.style.overflow="";
  try{ if(history.state&&history.state.sheet) history.back(); }catch(e){}
}

/* ======================= boot ======================= */
let TAB="day", VD=0;
function render(keep){
  const y=keep?window.scrollY:0;
  const n=nowIST(), td=tripDay(n);
  $("#rail").innerHTML=railHtml();
  $("#avnum").textContent=td?td:(VD+1);
  $("#greetsub").textContent=td?("Day "+td+" of nine · "+DAYS[VD].title)
    :(td===0&&n.y===2026&&(n.mo<10||(n.mo===10&&n.d<24))?"Getting ready · "+DAYS[VD].date
    :DAYS[VD].dow+" "+DAYS[VD].date+" · "+DAYS[VD].title);
  $("#view").innerHTML = TAB==="day"?viewDay():TAB==="route"?viewRoute():TAB==="car"?viewCar():viewInfo();
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===TAB)));
  $(".rail").style.display = TAB==="day"?"":"none";
  stopCar();
  if(TAB==="car") wireCar();
  if(keep) window.scrollTo(0,y); else window.scrollTo(0,0);
}

document.addEventListener("click",e=>{
  const el=e.target.closest("[data-go]"); if(!el) return;
  const a=el.dataset.go, v=el.dataset.v;
  if(a==="day"){ VD=+v; TAB="day"; render(false); return; }
  if(a==="open"){ openSheet(v); return; }
  if(a==="close"){ closeSheet(); return; }
  if(a==="paint"){
    S.paint=+v; save();
    if(carApi) carApi.setPaint(PAINTS[+v].key);
    document.querySelectorAll(".swatch").forEach((el,i)=>el.setAttribute("aria-pressed",String(i===+v)));
    return;
  }
  if(a==="got"){ S.got[v]=Date.now(); delete S.skip[v]; try{navigator.vibrate&&navigator.vibrate(18);}catch(x){} }
  else if(a==="skip"){ S.skip[v]=1; delete S.got[v]; }
  else if(a==="undo"){ delete S.got[v]; delete S.skip[v]; }
  else if(a==="edit"){
    const st=DAYS.map(D=>D.stay).find(s=>s.sid===v);
    const r=prompt("Name or address to open in Google Maps",S.loc[v]||st.q);
    if(r!==null&&r.trim()) S.loc[v]=r.trim(); else return;
  }
  else if(a==="reset"){ if(!confirm("Clear every reached, skipped and checklist mark?")) return; S.got={};S.skip={};S.chk={}; }
  save();
  if(openKey&&["got","skip","undo"].includes(a)) openSheet(openKey);
  render(true);
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.matches&&t.matches(".chk input")){ S.chk[t.dataset.k]=t.checked; save(); }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeSheet(); });
window.addEventListener("popstate",()=>{ if(openKey) closeSheet(); });

(function init(){
  const n=nowIST(), td=tripDay(n);
  VD = td ? td-1 : ((n.y>2026||(n.y===2026&&n.mo>=11))?8:0);
  const wantTab=new URLSearchParams(location.search).get("tab");
  if(["day","route","info"].includes(wantTab)) TAB=wantTab;
  document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>{TAB=b.dataset.tab;render(false);}));
  render(false);
  if(VD===0||td===0){ const sel=document.querySelector('.chip[aria-current="true"]'); if(sel) sel.scrollIntoView({inline:"center",block:"nearest"}); }
  try{ if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)) navigator.serviceWorker.register("sw.js"); }catch(e){}
  try{
    const ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
    if(ios&&!navigator.standalone&&!localStorage.getItem("kerala-hint")){
      const bar=document.createElement("div");
      bar.className="hintbar";
      bar.innerHTML='<span>Install: tap Share, then <b>Add to Home Screen</b>.</span><button aria-label="Dismiss">×</button>';
      bar.querySelector("button").onclick=()=>{ try{localStorage.setItem("kerala-hint","1");}catch(e){} bar.remove(); };
      document.body.appendChild(bar);
    }
  }catch(e){}
})();
</script>
</body>
