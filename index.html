<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0C2B33">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kerala '26">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Nine days by road: Madurai, Munnar, the Alleppey backwaters and Kochi. 24 October to 1 November 2026.">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="referrer" content="no-referrer">
<title>Kerala by road</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400&family=Mukta:wght@400;500;600;700&family=Rozha+One&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#0C2B33;
  --deep:#08222A;
  --surface:#113A44;
  --surface-2:#16454F;
  --line:rgba(246,234,216,.14);
  --line-2:rgba(246,234,216,.08);
  --sandal:#F6EAD8;
  --dim:rgba(246,234,216,.62);
  --dimmer:rgba(246,234,216,.42);
  --marigold:#F0A72B;
  --vermilion:#D8452B;
  --palm:#4C9E72;
  --teal:#2A9D9D;
  --brass:#C8A15A;
  --go:#5FBF8B;
  --display:"Rozha One",Georgia,serif;
  --body:"Mukta",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --hand:"Kalam",var(--body);
  --r:18px;
  --tab:62px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--sky);color:var(--sandal);
  font:400 15.5px/1.6 var(--body);
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--tab) + env(safe-area-inset-bottom) + 26px);
  -webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(120% 60% at 50% 0%,rgba(240,167,43,.07),transparent 70%);
}
h1,h2,h3,p,ol,ul,dl,dt,dd,figure{margin:0}
ol,ul{padding:0;list-style:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
a{color:inherit}
img,svg{display:block}
:focus-visible{outline:2px solid var(--marigold);outline-offset:3px;border-radius:6px}
.wrap{max-width:600px;margin:0 auto;padding:0 16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}

/* ---------- handwritten eyebrow ---------- */
.eyebrow{font:400 17px/1.2 var(--hand);color:var(--marigold);margin:28px 0 10px;letter-spacing:.01em}
.eyebrow.plain{color:var(--brass)}

/* ---------- route rail ---------- */
.rail{
  position:sticky;top:0;z-index:40;background:rgba(12,43,51,.9);
  backdrop-filter:saturate(160%) blur(14px);-webkit-backdrop-filter:saturate(160%) blur(14px);
  border-bottom:1px solid var(--line-2);padding-top:env(safe-area-inset-top);
}
.rail-in{display:flex;gap:24px;overflow-x:auto;scrollbar-width:none;padding:13px 22px 11px;max-width:600px;margin:0 auto}
.rail-in::-webkit-scrollbar{display:none}
.node{position:relative;flex:0 0 auto;width:38px;text-align:center}
.node+.node:before{content:"";position:absolute;left:-24px;top:15px;width:24px;border-top:2px dashed rgba(246,234,216,.28)}
.node .dot{
  display:grid;place-content:center;width:32px;height:32px;margin:0 auto;border-radius:50%;
  border:1.5px solid var(--line);color:var(--dim);
  font:700 13px/1 var(--body);font-variant-numeric:tabular-nums;background:rgba(8,34,42,.6);
}
.node .dd{display:block;margin-top:5px;font:500 10.5px/1.2 var(--body);color:var(--dimmer);letter-spacing:.02em}
.node[aria-current="true"] .dot{
  background:var(--c);border-color:var(--marigold);color:#08181C;
  box-shadow:0 0 0 3px rgba(240,167,43,.24);transform:scale(1.1);font-weight:700;
}
.node[aria-current="true"] .dd{color:var(--sandal);font-weight:600}
.node.done .dot{background:rgba(95,191,139,.16);border-color:var(--go);color:var(--go)}

/* ---------- day plate ---------- */
.plate{position:relative;border-radius:var(--r);overflow:hidden;margin-top:16px;background:var(--deep);border:1px solid rgba(240,167,43,.16);box-shadow:0 14px 38px rgba(0,0,0,.38)}
.plate-art{position:relative;aspect-ratio:16/9;overflow:hidden}
.plate-art svg{width:100%;height:100%}
.plate-art:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(6,24,30,.78),rgba(6,24,30,.18) 34%,rgba(6,24,30,0) 52%)}
.plate-hand{position:absolute;left:16px;right:16px;bottom:12px;z-index:2;font:400 16px/1.2 var(--hand);color:#FFDC96;text-shadow:0 2px 10px rgba(0,0,0,.55)}
.plate-cap{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:12px;padding:14px 16px 16px;background:linear-gradient(165deg,var(--surface-2),var(--deep))}
.plate-cap h1{font:400 clamp(23px,6.4vw,31px)/1.15 var(--display);color:#FFF9EF}
.plate-no{font:400 58px/.8 var(--display);color:var(--c);opacity:.62;letter-spacing:-.02em}
.pill{
  display:inline-block;vertical-align:4px;margin-left:9px;border:1px solid rgba(240,167,43,.6);
  background:rgba(240,167,43,.16);color:#FFD98A;border-radius:999px;
  font:600 10.5px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;padding:5px 8px
}

/* ---------- facts ---------- */
.facts{position:relative;z-index:2;display:grid;grid-template-columns:1fr 1fr;background:rgba(8,34,42,.86);border-top:1px solid var(--line)}
.facts>div{padding:12px 16px;border-bottom:1px solid var(--line-2);border-right:1px solid var(--line-2)}
.facts>div:nth-child(2n){border-right:0}
.facts>div:nth-last-child(-n+2){border-bottom:0}
.facts dt{font:500 10.5px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--dimmer)}
.facts dd{font:600 15px/1.35 var(--body);color:var(--sandal);margin-top:6px}

/* ---------- next stop ---------- */
.next{
  position:relative;margin-top:14px;border-radius:var(--r);overflow:hidden;
  background:linear-gradient(160deg,var(--surface-2),var(--surface));
  border:1px solid rgba(240,167,43,.34);box-shadow:0 8px 26px rgba(0,0,0,.28);
}
.next:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--marigold)}
.next-in{padding:16px 18px 17px 20px}
.next-eye{font:400 15px/1 var(--hand);color:var(--marigold)}
.next h2{font:400 clamp(21px,5.8vw,25px)/1.16 var(--display);color:#FFF9EF;margin-top:7px}
.next p{font-size:14.5px;line-height:1.55;color:var(--dim);margin-top:8px}
.next-act{display:flex;gap:9px;margin-top:15px}
.next-then{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:13.5px;color:var(--dim)}
.next-then b{color:var(--sandal);font-weight:600}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:47px;padding:0 17px;border-radius:12px;
  font:600 14.5px/1 var(--body);border:1.5px solid var(--line);
  background:rgba(246,234,216,.06);color:var(--sandal);text-decoration:none;
  transition:transform .12s ease,filter .15s ease;
}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--marigold);border-color:var(--marigold);color:#20160A}
.btn-go{background:rgba(95,191,139,.16);border-color:var(--go);color:#9FE3BF}
.btn-quiet{background:transparent;border-color:var(--line);color:var(--dim)}
.btn-w{flex:1}
.btn svg{width:17px;height:17px;flex:none}

/* ---------- stop rows ---------- */
.rows{border-radius:var(--r);overflow:hidden;background:var(--surface);border:1px solid var(--line-2)}
.rows>li+li{border-top:1px solid var(--line-2)}
.row{display:grid;grid-template-columns:66px minmax(0,1fr) 26px;gap:12px;align-items:center;width:100%;padding:14px 16px;transition:background .15s}
.row:active{background:rgba(246,234,216,.05)}
.row-time{font:600 13.5px/1.3 var(--body);color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.row-nm{font:600 15px/1.35 var(--body);color:var(--sandal);min-width:0}
.row-sub{display:block;font:400 12.5px/1.4 var(--body);color:var(--dimmer);margin-top:4px}
.row-mk{justify-self:end;width:23px;height:23px;border:1.5px solid var(--line);border-radius:50%;display:grid;place-content:center;color:transparent}
.row-mk svg{width:12px;height:12px}
.row.is-next .row-mk{border-color:var(--marigold);background:var(--marigold);box-shadow:0 0 0 4px rgba(240,167,43,.16)}
.row.is-next .row-nm,.row.is-next .row-time{color:#FFF9EF;font-weight:700}
.row.done .row-mk{background:rgba(95,191,139,.2);border-color:var(--go);color:var(--go)}
.row.done .row-nm{color:var(--dim);font-weight:500}
.row.done .row-time{color:var(--go)}
.row.hoff .row-nm{color:var(--dimmer);text-decoration:line-through}
.row-opt .row-nm:after{
  content:"optional";display:inline-block;font:600 9.5px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;
  color:var(--brass);border:1px solid rgba(200,161,90,.4);border-radius:5px;padding:3px 5px;margin-left:9px;vertical-align:2px
}

/* ---------- disclosures ---------- */
.acc+.acc{margin-top:12px}
.acc{border-radius:var(--r);overflow:hidden;background:var(--surface);border:1px solid var(--line-2)}
.acc>summary{display:flex;align-items:center;gap:10px;padding:15px 16px;cursor:pointer;list-style:none;font:600 14.5px/1.3 var(--body);color:var(--sandal)}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary:after{content:"";width:8px;height:8px;margin-left:auto;border-right:1.8px solid var(--brass);border-bottom:1.8px solid var(--brass);transform:rotate(45deg) translateY(-2px);transition:transform .2s}
.acc[open]>summary:after{transform:rotate(-135deg) translateY(-1px)}
.acc[open]>summary{border-bottom:1px solid var(--line-2)}
.acc-bd{padding:6px 16px 16px}
.tl li{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;padding:11px 0;border-top:1px solid var(--line-2)}
.tl li:first-child{border-top:0}
.tl time{font:600 13px/1.5 var(--body);color:var(--brass);font-variant-numeric:tabular-nums}
.tl p{font-size:14.5px;line-height:1.55;color:var(--dim)}
.tl li.key time{color:var(--marigold)}
.tl li.key p{color:var(--sandal)}
.tl li.now{background:rgba(240,167,43,.07)}
.tl li.now time:after{content:"now";display:block;font:600 9.5px/1.4 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--marigold)}
.tl li.past{opacity:.45}
.note-p{font-size:14.5px;line-height:1.6;color:var(--dim)}
.tips li{position:relative;padding-left:16px;font-size:14.5px;line-height:1.55;color:var(--dim);margin-top:10px}
.tips li:before{content:"";position:absolute;left:0;top:.62em;width:5px;height:5px;border-radius:50%;background:var(--brass);opacity:.7}

/* ---------- route page ---------- */
.page-h{font:400 clamp(34px,10vw,46px)/1.06 var(--display);color:#FFF9EF;margin-top:22px}
.page-h em{font-style:normal;color:var(--marigold)}
.page-lede{color:var(--dim);font-size:15px;line-height:1.6;margin-top:12px}
.stat{display:flex;align-items:baseline;gap:8px;margin-top:22px;font:600 14px/1.4 var(--body)}
.stat span{color:var(--dimmer);font-weight:400}
.bar{height:5px;border-radius:3px;background:rgba(246,234,216,.12);margin-top:10px;overflow:hidden}
.bar u{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--palm),var(--marigold));width:var(--p,0%)}
.days{border-radius:var(--r);overflow:hidden;background:var(--surface);border:1px solid var(--line-2)}
.day{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:13px 16px;transition:background .15s}
.day:active{background:rgba(246,234,216,.05)}
.day+.day{border-top:1px solid var(--line-2)}
.day-no{
  display:grid;place-content:center;width:34px;height:34px;border-radius:50%;
  background:var(--c);color:#08181C;font:700 13px/1 var(--body);font-variant-numeric:tabular-nums;
}
.day-dt{display:block;font:500 10.5px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--dimmer)}
.day-ti{display:block;font:400 16px/1.3 var(--display);color:var(--sandal);margin-top:5px}
.day-sub{display:block;font:400 12.5px/1.4 var(--body);color:var(--dimmer);margin-top:5px}
.day-km{font:600 13px/1 var(--body);color:var(--dim);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;min-width:56px}
.day-km em{display:block;font:500 11.5px/1.4 var(--body);font-style:normal;color:var(--go);margin-top:7px}
.day-km em.zero{color:var(--dimmer)}

/* ---------- money ---------- */
.ledger{padding:4px 16px 12px}
.ledger li{display:flex;align-items:baseline;gap:8px;padding:11px 0;border-bottom:1px solid var(--line-2)}
.ledger li:last-child{border-bottom:0}
.ledger .l{order:1;font-size:14.5px;color:var(--dim);min-width:0}
.ledger .d{order:2;flex:1;min-width:12px}
.ledger b{order:3;font:600 14.5px/1.35 var(--body);color:var(--sandal);white-space:nowrap;font-variant-numeric:tabular-nums}
.ledger .tot{margin-top:4px;padding-top:15px;border-top:1.5px solid rgba(240,167,43,.45);border-bottom:0}
.ledger .tot .l{font:600 12px/1.4 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--brass)}
.ledger .tot b{font:400 24px/1 var(--display);color:var(--marigold)}

/* ---------- checklist ---------- */
.chk{padding:2px 16px}
.chk li+li{border-top:1px solid var(--line-2)}
.chk label{display:flex;gap:12px;align-items:flex-start;padding:13px 0;cursor:pointer}
.chk input{
  appearance:none;-webkit-appearance:none;flex:none;width:22px;height:22px;margin:1px 0 0;
  border:1.5px solid rgba(246,234,216,.28);border-radius:7px;background:rgba(8,34,42,.5);
  display:grid;place-content:center;cursor:pointer;transition:background .15s,border-color .15s;
}
.chk input:checked{background:var(--go);border-color:var(--go)}
.chk input:checked:after{content:"";width:4px;height:9px;border:solid #08181C;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.chk span{font-size:14.5px;line-height:1.55;color:var(--dim)}
.chk input:checked+span{color:var(--dimmer);text-decoration:line-through;text-decoration-color:rgba(246,234,216,.25)}
.hint{color:var(--dimmer);font-size:13.5px;line-height:1.55}

/* ---------- tabs ---------- */
.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  background:rgba(8,34,42,.94);backdrop-filter:saturate(160%) blur(16px);-webkit-backdrop-filter:saturate(160%) blur(16px);
  border-top:1px solid var(--line-2);padding-bottom:env(safe-area-inset-bottom);
}
.tabs div{display:flex;max-width:600px;margin:0 auto}
.tabs button{
  flex:1;min-height:var(--tab);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  font:600 10.5px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--dimmer);transition:color .15s;
}
.tabs svg{width:22px;height:22px}
.tabs button[aria-selected="true"]{color:var(--marigold)}
.tabs button[aria-selected="true"] svg{filter:drop-shadow(0 0 8px rgba(240,167,43,.4))}

/* ---------- detail sheet ---------- */
.sheet{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end}
.sheet[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(4,18,22,.66);border:0;padding:0;cursor:default;animation:fade .2s ease-out}
.panel{
  position:relative;width:100%;max-width:600px;margin:0 auto;max-height:90vh;overflow-y:auto;
  background:var(--surface);border-radius:22px 22px 0 0;border-top:4px solid var(--c,var(--marigold));
  padding-bottom:calc(env(safe-area-inset-bottom) + 20px);animation:rise .3s cubic-bezier(.2,.8,.25,1);
}
.grab{width:38px;height:4px;border-radius:2px;background:rgba(246,234,216,.22);margin:10px auto 0}
.panel figure{margin:14px 0 0;aspect-ratio:16/10;background:var(--deep);overflow:hidden}
.panel figure img{width:100%;height:100%;object-fit:cover}
.panel .cap{font:400 11px/1 var(--body);color:var(--dimmer);padding:8px 18px 0}
.panel .cap a{text-decoration:underline}
.panel-bd{padding:14px 18px 0}
.panel-bd h2{font:400 clamp(22px,6vw,27px)/1.18 var(--display);color:#FFF9EF}
.pmeta{font:400 15px/1.3 var(--hand);color:var(--marigold)}
.ptext{font-size:15px;line-height:1.6;color:var(--dim);margin-top:10px}
.act{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}
.marked{font-size:13px;color:var(--go);margin-top:13px;font-weight:500}

/* ---------- install hint ---------- */
.hintbar{
  position:fixed;left:12px;right:12px;bottom:calc(var(--tab) + env(safe-area-inset-bottom) + 12px);z-index:65;
  background:var(--marigold);color:#20160A;font:500 13px/1.45 var(--body);border-radius:14px;
  box-shadow:0 8px 26px rgba(0,0,0,.4);display:flex;align-items:center;gap:10px;padding:12px 14px;
  max-width:576px;margin:0 auto;
}
.hintbar b{font-weight:700}
.hintbar button{margin-left:auto;color:rgba(32,22,10,.6);font:400 20px/1 var(--body);padding:2px 4px}

@keyframes rise{from{transform:translateY(18px);opacity:.5}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;transition-duration:.001ms!important}}
@media (min-width:520px){
  .facts{grid-template-columns:repeat(4,1fr)}
  .facts>div{border-bottom:0;border-right:1px solid var(--line-2)!important}
  .facts>div:last-child{border-right:0!important}
  .plate-txt{padding:128px 22px 22px}
}
@media print{.tabs,.rail,.hintbar,.btn{display:none}body{background:#fff;color:#000}}
</style>
</head>
<body>

<nav class="rail" aria-label="Choose a day"><div class="rail-in" id="rail"></div></nav>
<main id="view"></main>

<nav class="tabs" role="tablist" aria-label="Sections"><div>
  <button role="tab" data-tab="day">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
      <circle cx="12" cy="10" r="4"/><path d="M2.5 19.5h19M5.5 15.5l1.6 1.4M18.5 15.5l-1.6 1.4"/></svg>
    <span>Day</span></button>
  <button role="tab" data-tab="route">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
      <circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="5.5" r="2.5"/>
      <path d="M8 18.5h6.5a3.5 3.5 0 0 0 0-7h-5a3.5 3.5 0 0 1 0-7H16"/></svg>
    <span>Route</span></button>
  <button role="tab" data-tab="info">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
      <path d="M4 7h16M4 12h16M4 17h10"/></svg>
    <span>Info</span></button>
</div></nav>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-h"></div>
<noscript><div class="wrap" style="padding-top:30px"><h1 class="page-h">Kerala by road</h1><p class="page-lede">Turn on JavaScript to see the itinerary.</p></div></noscript>

<script>
/* ======================= the nine plates =======================
   Hand-drawn flat vector scenes, one per day, in the Kerala mural
   palette: indigo water, marigold light, vermilion earth, palm green. */
const ART = {
/* Madurai — a gopuram at sunrise, the road running to its door */
gopuram:()=>`<svg viewBox="0 0 800 450" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
<defs><linearGradient id="a1" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#3E2545"/><stop offset=".38" stop-color="#7E3139"/>
<stop offset=".66" stop-color="#C4562E"/><stop offset=".88" stop-color="#E8912F"/>
<stop offset="1" stop-color="#F0A72B"/></linearGradient></defs>
<rect width="800" height="450" fill="url(#a1)"/>
<circle cx="486" cy="346" r="98" fill="#F0A72B" opacity=".15"/>
<circle cx="486" cy="346" r="60" fill="#FFD07A" opacity=".92"/>

/* ======================= helpers ======================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toMin(s){
  const m=String(s).match(/^(\d+):(\d+)\s*(AM|PM)$/i);
  if(!m) return s==="Morning"?540:null;
  let h=(+m[1])%12; if(m[3].toUpperCase()==="PM") h+=12;
  return h*60+(+m[2]);
}
function nowIST(){
  const q=new URLSearchParams(location.search).get("now");
  const t=q&&q.match(/^(\d{4})-(\d\d)-(\d\d)T(\d\d):(\d\d)/);
  if(t) return {y:+t[1],mo:+t[2],d:+t[3],min:(+t[4])*60+(+t[5])};
  const p={};
  new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Kolkata",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"})
    .formatToParts(new Date()).forEach(x=>{p[x.type]=x.value;});
  return {y:+p.year,mo:+p.month,d:+p.day,min:(+p.hour)*60+(+p.minute)};
}
function tripDay(n){
  if(n.y!==2026) return 0;
  if(n.mo===10&&n.d>=24&&n.d<=31) return n.d-23;
  if(n.mo===11&&n.d===1) return 9;
  return 0;
}
function clock(ts){ try{return new Date(ts).toLocaleTimeString("en-IN",{timeZone:"Asia/Kolkata",hour:"numeric",minute:"2-digit",hour12:true}).toUpperCase();}catch(e){return "";} }
const navUrl=q=>"https://www.google.com/maps/dir/?api=1&travelmode=driving&destination="+encodeURIComponent(q);
const TOTAL_KM=DAYS.reduce((a,D)=>a+D.km,0);
const WORDS=["one","two","three","four","five","six","seven","eight","nine"];
const ICON={
  nav:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.5 21 21l-9-4.2L3 21z"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 12.5 9.5 17.5 19.5 6.5"/></svg>',
  here:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 21.5s7-5.6 7-11a7 7 0 1 0-14 0c0 5.4 7 11 7 11z"/><circle cx="12" cy="10.5" r="2.6"/></svg>'
};

/* ======================= state ======================= */
const KEY="kerala-trip-2026-app";
let S={got:{},skip:{},loc:{},chk:{}};
try{ Object.assign(S,JSON.parse(localStorage.getItem(KEY)||"{}")); }catch(e){}
function save(){ try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} }

function stopsOf(i){
  const D=DAYS[i], st=D.stay;
  const list=D.places.map((p,j)=>({k:i+"."+j,n:p.n,d:p.d,q:p.q,t:p.t||"",w:p.w||"",alt:!!p.alt,rl:p.rl||"Reached"}));
  list.push({k:i+".s",n:st.n,d:st.t,q:S.loc[st.sid]||st.q,t:st.at,w:st.w||"",alt:false,rl:st.rl,stay:st});
  return list.map((s,x)=>({s,x,m:s.t?toMin(s.t):null}))
    .sort((a,b)=>((a.s.alt?1:0)-(b.s.alt?1:0))||((a.m===null?9999:a.m)-(b.m===null?9999:b.m))||(a.x-b.x))
    .map(o=>o.s);
}
const isDone=s=>!!S.got[s.k]||!!S.skip[s.k];
const nextStop=i=>{ const L=stopsOf(i); return L.find(s=>!s.alt&&!isDone(s))||null; };
function dayProg(i){ const L=stopsOf(i).filter(s=>!s.alt); return {d:L.filter(isDone).length,n:L.length}; }
function allProg(){ let d=0,n=0; DAYS.forEach((_,i)=>{const p=dayProg(i); d+=p.d; n+=p.n;}); return {d,n}; }

/* ======================= photos (lazy, cached) ======================= */
const IMGK="kerala-trip-2026-photos";
let IMG={}; try{ IMG=JSON.parse(localStorage.getItem(IMGK)||"{}"); }catch(e){}
async function photoFor(w){
  const list=(w||"").split("|").filter(Boolean);
  for(const t of list) if(IMG[t]&&IMG[t].s) return IMG[t];
  const need=list.filter(t=>IMG[t]===undefined);
  if(!need.length) return null;
  try{
    const url="https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&prop=pageimages&piprop=thumbnail&pithumbsize=1200&titles="+encodeURIComponent(need.join("|"));
    const j=await (await fetch(url)).json();
    const norm={},redir={},by={};
    (j.query&&j.query.normalized||[]).forEach(x=>norm[x.from]=x.to);
    (j.query&&j.query.redirects||[]).forEach(x=>redir[x.from]=x.to);
    Object.values(j.query&&j.query.pages||{}).forEach(pg=>{ if(pg.thumbnail&&pg.thumbnail.source) by[pg.title]={s:pg.thumbnail.source,p:pg.title}; });
    need.forEach(t=>{ let x=norm[t]||t; x=redir[x]||x; IMG[t]=by[x]||0; });
    try{ localStorage.setItem(IMGK,JSON.stringify(IMG)); }catch(e){}
  }catch(e){ /* offline: no photo, everything else still works */ }
  for(const t of list) if(IMG[t]&&IMG[t].s) return IMG[t];
  return null;
}

/* ======================= route rail ======================= */
function railHtml(){
  const items=DAYS.map((D,i)=>{
    const p=dayProg(i), done=p.n&&p.d===p.n;
    return `<button class="node ${done?"done":""}" style="--c:${D.c}" data-go="day" data-v="${i}"
      ${i===VD?'aria-current="true"':""} aria-label="Day ${i+1}, ${D.dow} ${D.date}: ${esc(D.title)}">
      <span class="dot">${i+1}</span><span class="dd">${D.short} ${D.date.split(" ")[1]}</span></button>`;
  }).join("");
  return items;
}

/* ======================= day view ======================= */
function nextHtml(i,isToday){
  const D=DAYS[i], nx=nextStop(i), L=stopsOf(i);
  if(!nx){
    const nd=i<DAYS.length-1?stopsOf(i+1).find(s=>!s.alt):null;
    return `<section class="next"><div class="next-in">
      <p class="next-eye">${i<DAYS.length-1?"day complete":"trip complete"}</p>
      <h2>${i<DAYS.length-1?"Every stop ticked off":"You are home"}</h2>
      ${nd?`<p>Tomorrow starts with ${esc(nd.n)}${nd.t?" at "+esc(nd.t):""}.</p>
      <div class="next-act"><button class="btn btn-primary btn-w" data-go="day" data-v="${i+1}">Open day ${i+2}</button></div>`
      :`<p>Safe travels.</p>`}
    </div></section>`;
  }
  const rest=L.filter(s=>!s.alt&&!isDone(s)&&s.k!==nx.k);
  const alts=L.filter(s=>s.alt&&!isDone(s));
  const started=L.some(s=>!s.alt&&isDone(s));
  const label=isToday||started?"next stop":"start here";
  return `<section class="next"><div class="next-in">
    <p class="next-eye">${label}${nx.t?` · ${esc(nx.t)}`:""}</p>
    <h2>${esc(nx.n)}</h2>
    <p>${esc(nx.d)}</p>
    <div class="next-act">
      <a class="btn btn-primary btn-w" href="${navUrl(nx.q)}" target="_blank" rel="noopener">${ICON.nav}Navigate</a>
      <button class="btn btn-w" data-go="got" data-v="${nx.k}">${esc(nx.rl)}</button>
    </div>
    ${rest.length?`<p class="next-then">Then <b>${esc(rest[0].n)}</b>${rest[0].t?" at "+esc(rest[0].t):""}</p>`:""}
    ${alts.length?`<p class="next-then">If there is time: <b>${esc(alts.map(a=>a.n).join(", "))}</b></p>`:""}
  </div></section>`;
}

function rowHtml(s,i){
  const got=S.got[s.k], skip=S.skip[s.k], nx=nextStop(i);
  const isNext=nx&&nx.k===s.k;
  const cls=["row",got?"done":"",skip?"hoff":"",s.alt?"row-opt":"",isNext?"is-next":""].join(" ");
  const time=got?clock(got):(s.t||(s.alt?"—":"Anytime"));
  const sub=s.stay?`<span class="row-sub">Tonight's stay</span>`:"";
  return `<li><button class="${cls}" data-go="open" data-v="${s.k}">
    <span class="row-time">${esc(time)}</span>
    <span class="row-nm">${esc(s.n)}${sub}</span>
    <span class="row-mk" aria-hidden="true">${ICON.check}</span>
    <span class="sr">${got?"Done":skip?"Skipped":"Not done yet"}</span>
  </button></li>`;
}

function viewDay(){
  const i=VD, D=DAYS[i], n=nowIST(), td=tripDay(n), isToday=td===i+1;
  const planned=stopsOf(i).filter(s=>!s.alt);
  const optional=stopsOf(i).filter(s=>s.alt);
  const items=D.tl.map(t=>({t,m:toMin(t[0])}));
  let cur=-1;
  if(isToday) items.forEach((o,x)=>{ if(o.m!==null&&o.m<=n.min) cur=x; });
  const art=(ART[D.art]||ART.fallback||"")();
  return `<div class="wrap">
    <article class="plate" style="--c:${D.c}">
      <div class="plate-art">${art}<p class="plate-hand">Day ${WORDS[i]} · ${D.dow} ${D.date} · ${D.km} km</p></div>
      <div class="plate-cap">
        <h1>${esc(D.title)}${D.badge?`<span class="pill">${esc(D.badge)}</span>`:""}</h1>
        <span class="plate-no" aria-hidden="true">${String(i+1).padStart(2,"0")}</span>
      </div>
      <dl class="facts">${D.facts.map(f=>`<div><dt>${esc(f[0])}</dt><dd>${esc(f[1])}</dd></div>`).join("")}</dl>
    </article>

    ${nextHtml(i,isToday)}

    <h2 class="eyebrow">today's stops</h2>
    <ol class="rows">${planned.map(s=>rowHtml(s,i)).join("")}</ol>
    ${optional.length?`<h2 class="eyebrow plain">if there is time</h2><ol class="rows">${optional.map(s=>rowHtml(s,i)).join("")}</ol>`:""}

    <h2 class="eyebrow plain">the detail</h2>
    <details class="acc">
      <summary>Hour by hour</summary>
      <div class="acc-bd"><ol class="tl">${items.map((o,x)=>
        `<li class="${o.t[2]?"key":""} ${x<cur?"past":""} ${x===cur?"now":""}"><time>${esc(o.t[0])}</time><p>${o.t[1]}</p></li>`
      ).join("")}</ol></div>
    </details>
    <details class="acc">
      <summary>Tonight · ${esc(D.stay.h)}</summary>
      <div class="acc-bd">
        <p class="note-p">${D.stay.t}</p>
        <div class="act"><a class="btn" href="${navUrl(S.loc[D.stay.sid]||D.stay.q)}" target="_blank" rel="noopener">${ICON.nav}Navigate</a>
        ${D.stay.sid!=="home"?`<button class="btn btn-quiet" data-go="edit" data-v="${D.stay.sid}">Set location</button>`:""}</div>
      </div>
    </details>
    <details class="acc">
      <summary>Good to know</summary>
      <div class="acc-bd"><ul class="tips">${D.tip.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>
    </details>
  </div>`;
}

/* ======================= route view ======================= */
function viewRoute(){
  const n=nowIST(), td=tripDay(n), p=allProg(), pc=p.n?Math.round(100*p.d/p.n):0;
  let when="";
  if(!td){
    const left=Math.round((Date.UTC(2026,9,24)-Date.UTC(n.y,n.mo-1,n.d))/864e5);
    when=left===1?"Starts tomorrow.":left>1?"Starts in "+left+" days.":"";
  } else if(td<=9) when="Today is day "+td+" of 9.";
  return `<div class="wrap">
    <h1 class="page-h">Kerala<br><em>by road</em></h1>
    <p class="page-lede">Nine days, 24 October to 1 November 2026. Madurai for the wedding, up to Munnar, a birthday night on an Alleppey houseboat, then Kochi and home through Salem.</p>
    <p class="stat num">${p.d} of ${p.n} stops done${when?` <span>· ${when}</span>`:""}</p>
    <div class="bar" style="--p:${pc}%"><u></u></div>
    <h2 class="eyebrow">the nine days</h2>
    <div class="days">${DAYS.map((D,i)=>{
      const q=dayProg(i);
      return `<button class="day" data-go="day" data-v="${i}">
        <span class="day-no" style="--c:${D.c}">${i+1}</span>
        <span><span class="day-dt">${D.dow} ${D.date}</span><span class="day-ti">${esc(D.title)}</span>
        <span class="day-sub">Night · ${esc(D.night)}</span></span>
        <span class="day-km num">${D.km} km<em class="${q.d?"":"zero"}">${q.d}/${q.n} done</em></span>
      </button>`;
    }).join("")}</div>
    <h2 class="eyebrow plain">the road</h2>
    <div class="rows" style="padding:15px 16px">
      <p class="note-p">About ${TOTAL_KM.toLocaleString("en-IN")} km door to door. Tata Safari, two adults, a 2-year-old and an infant.</p>
      <p class="hint" style="margin-top:10px">Timings, fares and opening hours are planning estimates — confirm them when you book. Drive times assume normal traffic.</p>
    </div>
  </div>`;
}

/* ======================= info view ======================= */
function ledger(list,total){
  const rows=list.map(([l,v])=>`<li><span class="l">${esc(l)}</span><i class="d"></i><b class="num">${esc(v)}</b></li>`).join("");
  return `<ul class="ledger">${rows}${total?`<li class="tot"><span class="l">Total</span><i class="d"></i><b class="num">${esc(total)}</b></li>`:""}</ul>`;
}
function chkList(arr){
  return `<ul class="chk">${arr.map(([k,t,def])=>
    `<li><label><input type="checkbox" data-k="${k}" ${(k in S.chk?S.chk[k]:!!def)?"checked":""}><span>${esc(t)}</span></label></li>`
  ).join("")}</ul>`;
}
function viewInfo(){
  return `<div class="wrap">
    <h1 class="page-h">Money<br><em>&amp; prep</em></h1>
    <h2 class="eyebrow">what it costs</h2>
    <div class="rows">${ledger(COSTS,"₹95,500")}</div>
    <p class="hint" style="margin-top:11px">Diesel at about ₹99.55 a litre, the Safari at roughly 12 km per litre on this mix of highway and ghat. The Munnar nights use ₹7,000 each until you enter your booked rates.</p>
    <h2 class="eyebrow">each night</h2>
    <div class="rows">${ledger(NIGHTS)}</div>
    <p class="hint" style="margin-top:11px">Aim for the houseboat at or just under your ₹10,000 limit: an AC one-bedroom with meals. Shoulder-season prices — confirm when you book.</p>
    <h2 class="eyebrow">before you go</h2>
    <div class="rows" style="padding-top:14px"><h3 style="font:400 17px/1.3 var(--display);padding:0 16px">Book this week</h3>${chkList(CHK.book)}</div>
    <h2 class="eyebrow plain">check on 23 and 24 Oct</h2>
    <div class="rows">${chkList(CHK.check)}</div>
    <h2 class="eyebrow plain">pack</h2>
    <div class="rows">${chkList(CHK.pack)}</div>
    <p class="hint" style="margin-top:16px">Ticks and reached marks stay on this device only.</p>
    <button class="btn btn-quiet" style="margin-top:10px" data-go="reset">Clear all ticks and marks</button>
  </div>`;
}

/* ======================= detail sheet ======================= */
let openKey=null;
function stopByKey(k){ const i=+String(k).split(".")[0]; return {i,s:stopsOf(i).find(x=>x.k===k)}; }
function sheetHtml(i,s){
  const D=DAYS[i], got=S.got[s.k], skip=S.skip[s.k];
  const edit=s.stay&&s.stay.sid!=="home";
  return `<div class="scrim" data-go="close"></div>
  <div class="panel" style="--c:${D.c}">
    <div class="grab"></div>
    <div class="panel-bd">
      <p class="pmeta">Day ${WORDS[i]} · ${D.dow} ${D.date}${s.t?" · "+esc(s.t):""}</p>
      <h2 id="sheet-h" style="margin-top:5px">${esc(s.n)}</h2>
      <p class="ptext">${esc(s.d)}</p>
      <div id="sheet-ph"></div>
      <div class="act">
        <a class="btn btn-primary" href="${navUrl(S.loc[s.stay?s.stay.sid:s.k]||s.q)}" target="_blank" rel="noopener">${ICON.nav}Navigate</a>
        ${got||skip?`<button class="btn" data-go="undo" data-v="${s.k}">Undo</button>`
                  :`<button class="btn btn-go" data-go="got" data-v="${s.k}">${esc(s.rl)}</button>`}
        ${!got&&!skip&&!s.stay?`<button class="btn btn-quiet" data-go="skip" data-v="${s.k}">Skip</button>`:""}
        ${edit&&!got?`<button class="btn btn-quiet" data-go="edit" data-v="${s.stay.sid}">Set location</button>`:""}
      </div>
      ${got?`<p class="marked">Marked at ${esc(clock(got))}.</p>`:""}
    </div>
  </div>`;
}
function openSheet(k){
  const {i,s}=stopByKey(k); if(!s) return;
  const el=$("#sheet");
  el.innerHTML=sheetHtml(i,s);
  el.hidden=false; openKey=k;
  document.body.style.overflow="hidden";
  try{ history.pushState({sheet:k},""); }catch(e){}
  const btn=el.querySelector(".panel .btn"); if(btn) btn.focus({preventScroll:true});
  if(s.w){
    photoFor(s.w).then(ph=>{
      const box=$("#sheet-ph");
      if(!box||!ph||openKey!==k) return;
      box.innerHTML=`<figure><img src="${ph.s}" alt="${esc(s.n)}"></figure>
        <p class="cap">Photo: <a href="https://en.wikipedia.org/wiki/${encodeURIComponent(ph.p.replace(/ /g,"_"))}" target="_blank" rel="noopener">Wikipedia</a></p>`;
    });
  }
}
function closeSheet(){
  const el=$("#sheet");
  if(el.hidden) return;
  el.hidden=true; el.innerHTML=""; openKey=null;
  document.body.style.overflow="";
  try{ if(history.state&&history.state.sheet) history.back(); }catch(e){}
}

/* ======================= boot ======================= */
let TAB="day", VD=0;
function render(keep){
  const y=keep?window.scrollY:0;
  $("#rail").innerHTML=railHtml();
  $("#view").innerHTML = TAB==="day"?viewDay():TAB==="route"?viewRoute():viewInfo();
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===TAB)));
  $(".rail").style.display = TAB==="day"?"":"none";
  if(keep) window.scrollTo(0,y); else window.scrollTo(0,0);
}

document.addEventListener("click",e=>{
  const el=e.target.closest("[data-go]"); if(!el) return;
  const a=el.dataset.go, v=el.dataset.v;
  if(a==="day"){ VD=+v; TAB="day"; render(false); return; }
  if(a==="open"){ openSheet(v); return; }
  if(a==="close"){ closeSheet(); return; }
  if(a==="got"){ S.got[v]=Date.now(); delete S.skip[v]; try{navigator.vibrate&&navigator.vibrate(18);}catch(x){} }
  else if(a==="skip"){ S.skip[v]=1; delete S.got[v]; }
  else if(a==="undo"){ delete S.got[v]; delete S.skip[v]; }
  else if(a==="edit"){
    const st=DAYS.map(D=>D.stay).find(s=>s.sid===v);
    const r=prompt("Name or address to open in Google Maps",S.loc[v]||st.q);
    if(r!==null&&r.trim()) S.loc[v]=r.trim(); else return;
  }
  else if(a==="reset"){ if(!confirm("Clear every reached, skipped and checklist mark?")) return; S.got={};S.skip={};S.chk={}; }
  save();
  if(openKey&&["got","skip","undo"].includes(a)) openSheet(openKey);
  render(true);
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.matches&&t.matches(".chk input")){ S.chk[t.dataset.k]=t.checked; save(); }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeSheet(); });
window.addEventListener("popstate",()=>{ if(openKey) closeSheet(); });

(function init(){
  const n=nowIST(), td=tripDay(n);
  VD = td ? td-1 : ((n.y>2026||(n.y===2026&&n.mo>=11))?8:0);
  const wantTab=new URLSearchParams(location.search).get("tab");
  if(["day","route","info"].includes(wantTab)) TAB=wantTab;
  document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>{TAB=b.dataset.tab;render(false);}));
  render(false);
  if(VD===0||td===0){ const sel=document.querySelector('.node[aria-current="true"]'); if(sel) sel.scrollIntoView({inline:"center",block:"nearest"}); }
  try{ if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)) navigator.serviceWorker.register("sw.js"); }catch(e){}
  try{
    const ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
    if(ios&&!navigator.standalone&&!localStorage.getItem("kerala-hint")){
      const bar=document.createElement("div");
      bar.className="hintbar";
      bar.innerHTML='<span>Install: tap Share, then <b>Add to Home Screen</b>.</span><button aria-label="Dismiss">×</button>';
      bar.querySelector("button").onclick=()=>{ try{localStorage.setItem("kerala-hint","1");}catch(e){} bar.remove(); };
      document.body.appendChild(bar);
    }
  }catch(e){}
})();
</script>
</body>
</html>
