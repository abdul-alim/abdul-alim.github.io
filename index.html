<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E3EFE5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kerala 2026">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Nine days by road: Madurai, Munnar, the Alleppey backwaters and Kochi. 24 October to 1 November 2026.">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="referrer" content="no-referrer">
<title>Kerala by road</title>
<link rel="manifest" href="manifest.webmanifest">
<!-- Absolute, at the origin root, no query string: the most conventional form
     WebKit can be given, and the same path it probes on its own. -->
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" href="/icons/icon-192.png" sizes="192x192">
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* map paper, near-black ink, and the day's own colour as the accent */
  --paper:#ECECE6;
  --paper-2:#E3E3DB;
  --ink:#16211C;
  --muted:#5C6A61;
  --line:rgba(22,33,28,.14);
  --line-2:rgba(22,33,28,.08);
  --btn-edge:#939F96;
  --day:#3E9A55;
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,monospace;
  --r:20px;
  --tab:62px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font:400 16px/1.55 var(--body);-webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--tab) + env(safe-area-inset-bottom) + 24px);
  -webkit-tap-highlight-color:transparent;
}
h1,h2,h3,p,ol,ul,dl,dt,dd,figure{margin:0}
ol,ul{padding:0;list-style:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
a{color:inherit}
img,svg{display:block}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:680px;margin:0 auto;padding:0 18px}
.mono{font-family:var(--mono)}

/* ---------- day view shell ---------- */
.dayview{max-width:680px;margin:0 auto}

/* ---------- the day's colour band ---------- */
.band{background:var(--c);padding:18px 18px 20px;position:relative}
.band:after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,0) 55%)}
.band-eye{position:relative;z-index:1;font:600 10.5px/1 var(--mono);letter-spacing:.1em;
  text-transform:uppercase;opacity:.72}
.band h1{position:relative;z-index:1;font:700 33px/1.02 var(--display);letter-spacing:-.035em;
  margin-top:11px;text-wrap:balance}
.band-wx{position:relative;z-index:1;margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-block;vertical-align:6px;margin-left:9px;background:var(--ink);color:#fff;
  border-radius:6px;font:600 9.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:6px 8px}

/* weather chip inside the band sits on colour, so it is translucent paper */
.wx{display:inline-flex;align-items:center;gap:7px;padding:7px 11px 7px 9px;border-radius:9px;
  background:rgba(255,255,255,.62);font:600 12px/1 var(--mono);color:var(--ink)}
.wx svg{width:15px;height:15px;flex:none;color:var(--ink);opacity:.75}
.wx b{font-weight:700;font-variant-numeric:tabular-nums}
.wx em{font-style:normal;opacity:.68}
.wx.wet{background:rgba(255,255,255,.82)}

/* ---------- the illustration, edge to edge ---------- */
.post-art{position:relative;width:100%;aspect-ratio:16/10;overflow:hidden;background:#CFE9F5;isolation:isolate}
.post-art .art-in{position:absolute;inset:0;z-index:0;transform-origin:52% 46%;
  animation:drift 34s ease-in-out infinite alternate}
.post-art svg{width:100%;height:100%}
.post-art.wx-rain:before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,rgba(58,96,118,.20) 0%,rgba(58,96,118,.10) 52%,rgba(58,96,118,.03) 100%)}
.post-art.wx-grey:before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,rgba(72,96,110,.17) 0%,rgba(72,96,110,.07) 60%,rgba(72,96,110,.02) 100%)}
.post-art .sky{position:absolute;left:-12%;right:-12%;top:-45%;height:180%;pointer-events:none;opacity:0;
  z-index:2;transition:opacity 1.2s ease;will-change:transform;
  -webkit-mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,.92) 58%,rgba(0,0,0,.45) 100%);
  mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,.92) 58%,rgba(0,0,0,.45) 100%)}
.post-art .s1{background:repeating-linear-gradient(101deg,rgba(255,255,255,.78) 0 1.4px,transparent 1.4px 15px);
  background-size:18px 30px}
.post-art .s2{background:repeating-linear-gradient(101deg,rgba(255,255,255,.5) 0 1px,transparent 1px 10px);
  background-size:12px 30px}
.post-art.wx-rain .s1{opacity:.55;animation:rain .66s linear infinite}
.post-art.wx-rain .s2{opacity:.34;animation:rain .42s linear infinite}

/* ---------- progress ---------- */
.prog{display:flex;align-items:center;gap:12px;margin-top:20px}
.prog-bar{flex:1;height:5px;border-radius:99px;background:var(--line);overflow:hidden}
.prog-bar u{display:block;height:100%;border-radius:99px;background:var(--c);width:var(--p,0%);
  transition:width .5s cubic-bezier(.2,.8,.25,1)}
.prog-l{font:600 10px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);white-space:nowrap}

/* ---------- the spine ---------- */
.spine{margin-top:22px}
.sp{display:grid;grid-template-columns:50px 26px minmax(0,1fr);align-items:start}
.sp-t{font:500 11px/1 var(--mono);color:var(--muted);font-variant-numeric:tabular-nums;
  text-align:right;padding:8px 8px 0 0;white-space:nowrap}
.sp-rail{position:relative;display:flex;justify-content:center;align-self:stretch}
.sp-rail:before{content:"";position:absolute;left:50%;transform:translateX(-50%);top:0;bottom:0;
  width:1.5px;background:var(--line)}
.sp:first-child .sp-rail:before{top:13px}
.sp:last-child .sp-rail:before{bottom:auto;height:13px}
.sp-dot{position:relative;z-index:1;width:26px;height:26px;border-radius:50%;background:var(--paper);
  border:1.5px solid var(--line);display:grid;place-content:center;color:transparent;
  transition:background .18s,border-color .18s}
.sp-dot svg{width:12px;height:12px}
.sp-dot:after{content:"";position:absolute;inset:-10px;border-radius:50%}
.sp-bd{padding:5px 0 24px 12px;min-width:0}
.sp-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;width:100%}
.sp-h b{font:700 16.5px/1.3 var(--body);letter-spacing:-.012em}
.sp-tag{font:600 8.5px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;padding:4px 6px;
  border-radius:5px;background:var(--ink);color:var(--paper)}
.sp-d{font-size:14px;color:var(--muted);line-height:1.5;margin-top:6px}
.sp-act{display:flex;gap:9px;margin-top:12px}
.sp.done .sp-dot{background:var(--c);border-color:transparent;color:var(--ink)}
.sp.done .sp-h b{color:var(--muted);font-weight:500;text-decoration:line-through}
.sp.done .sp-t{color:var(--ink);font-weight:600}
.sp.next .sp-dot{background:var(--ink);border-color:transparent;color:var(--paper)}
.sp.next .sp-h b{font-weight:700}
.sp.skip .sp-dot{background:var(--paper-2);border-color:var(--line);color:var(--muted)}
.sp.skip .sp-h b{color:var(--muted);text-decoration:line-through}
.sp-end .sp-dot{background:var(--ink);border-color:transparent;color:var(--paper)}
.sp-end .sp-bd>b{font:700 16.5px/1.3 var(--body)}

/* ---------- the menu ---------- */
.xlist{margin-top:6px;border-top:1px solid var(--line)}
.x{border-bottom:1px solid var(--line)}
.x-go{display:block;padding:14px 2px;transition:background .15s}
.x-go:active{background:var(--paper-2)}
.x-top{display:flex;align-items:baseline;gap:10px}
.rate{flex:none;display:flex;font-size:11px;letter-spacing:.06em;line-height:1.5}
.rate i{font-style:normal}
.rate .s-on{color:var(--ink)}
.rate .s-off{color:rgba(22,33,28,.26)}
.x-top b{flex:1;min-width:0;font:600 15.5px/1.3 var(--body);letter-spacing:-.008em}
.x-nav{flex:none;align-self:center;width:26px;height:26px;border-radius:50%;background:var(--c);
  display:grid;place-content:center;color:var(--ink)}
.x-nav svg{width:13px;height:13px}
.x-d{display:block;font-size:13px;color:var(--muted);line-height:1.45;margin-top:4px;padding-right:34px}

/* ---------- section heads ---------- */
.eye{display:flex;align-items:center;gap:8px;font:600 11px/1.3 var(--mono);letter-spacing:.1em;
  text-transform:uppercase;margin:32px 0 12px;color:var(--muted)}
.eye svg{width:14px;height:14px;flex:none}
.hint{color:var(--muted);font-size:12.5px;line-height:1.5;margin-top:10px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;
  border-radius:99px;font:600 14.5px/1 var(--body);background:transparent;color:var(--ink);
  border:1.5px solid var(--btn-edge);text-decoration:none;flex:0 0 auto;white-space:nowrap;
  transition:transform .12s,opacity .18s}
.btn:active{transform:scale(.96)}
.btn-primary{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn-leaf{background:var(--c,var(--ink));border-color:var(--c,var(--ink));color:var(--ink)}
.btn-quiet{background:transparent;border-color:var(--line);color:var(--muted)}
.btn-w{flex:1}
.btn svg{width:17px;height:17px;flex:none}

/* ---------- disclosure ---------- */
.acc{margin-top:1px;border-top:1px solid var(--line)}
.acc>summary{display:flex;align-items:center;gap:10px;padding:16px 2px;cursor:pointer;list-style:none;
  font:600 14px/1.3 var(--mono);letter-spacing:.02em}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary svg{width:17px;height:17px;flex:none;color:var(--muted)}
.acc>summary .chev{margin-left:auto;transition:transform .25s}
.acc>summary .chev svg{width:13px;height:13px;color:var(--muted)}
.acc[open]>summary .chev{transform:rotate(180deg)}
.acc-bd{padding:0 2px 18px}
.tl li{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid var(--line-2)}
.tl li:first-child{border-top:0}
.tl time{font:500 11.5px/1.7 var(--mono);color:var(--ink)}
.tl p{font-size:14.5px;color:var(--muted);line-height:1.55}
.tl li.key p{color:var(--ink);font-weight:500}
.tl li.now{background:var(--paper-2);border-radius:8px;padding-left:9px;padding-right:9px;margin:0 -9px}
.tl li.now time:after{content:"now";display:block;font-size:9px;letter-spacing:.1em;text-transform:uppercase}
.tl li.past{opacity:.45}
.note-p{font-size:15px;color:var(--muted);line-height:1.6}
.tips li{position:relative;padding-left:18px;font-size:14.5px;color:var(--muted);line-height:1.55;margin-top:10px}
.tips li:before{content:"";position:absolute;left:0;top:8px;width:6px;height:1.5px;background:var(--ink)}

/* ---------- greeting ---------- */
.hi{padding:calc(env(safe-area-inset-top) + 16px) 0 0}
.hi .wrap{display:flex;align-items:center;gap:12px}
.hi-txt{flex:1;min-width:0}
.hi-txt b{display:block;font:700 19px/1.1 var(--display);letter-spacing:-.03em}
.hi-txt small{display:block;font:500 12px/1.4 var(--mono);color:var(--muted);margin-top:4px}
.avatar{flex:none;width:50px;height:50px;border-radius:14px;background:var(--day);color:var(--ink);
  display:grid;place-content:center;text-align:center}
.avatar b{font:700 21px/1 var(--display);letter-spacing:-.03em}
.avatar small{display:block;font:600 7.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;margin-top:3px;opacity:.75}

/* ---------- rail ---------- */
.rail{position:sticky;top:0;z-index:40;background:var(--paper);border-bottom:1px solid var(--line)}
.rail-in{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:10px 16px;max-width:680px;margin:0 auto}
.rail-in::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 11px;border-radius:9px;background:transparent;border:1px solid var(--line);
  text-align:center;min-width:52px;transition:background .18s,color .18s}
.chip small{display:block;font:500 8.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.chip b{display:block;font:700 15px/1.2 var(--display);margin-top:3px;font-variant-numeric:tabular-nums}
.chip:active{background:var(--paper-2)}
.chip[aria-current="true"]{background:var(--c);border-color:var(--ink)}
.chip[aria-current="true"] small,.chip[aria-current="true"] b{color:var(--ink)}
.chip.done:after{content:"";display:block;width:4px;height:4px;border-radius:50%;background:var(--ink);margin:4px auto 0}

/* ---------- tabs ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:60;padding-bottom:env(safe-area-inset-bottom);
  background:var(--paper);border-top:1px solid var(--line)}
.tabs div{display:flex;max-width:680px;margin:0 auto}
.tabs button{flex:1;min-height:var(--tab);display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:5px;font:600 9.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  position:relative;transition:color .15s}
.tabs svg{width:20px;height:20px}
.tabs button[aria-selected="true"]{color:var(--ink)}
.tabs button[aria-selected="true"]:before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;
  background:var(--day)}

/* ---------- sheet ---------- */
.sheet{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end}
.sheet[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(22,33,28,.45);border:0;padding:0;cursor:default;
  animation:fade .2s both}
.panel{position:relative;width:100%;max-width:680px;margin:0 auto;max-height:90vh;overflow-y:auto;
  background:var(--paper);border-radius:22px 22px 0 0;padding-bottom:calc(env(safe-area-inset-bottom) + 20px);
  animation:rise .38s cubic-bezier(.16,.9,.3,1) both}
.grab{width:38px;height:4px;border-radius:99px;background:var(--line);margin:10px auto 0}
.panel figure{margin:14px 0 0;aspect-ratio:16/10;background:var(--paper-2);overflow:hidden}
.panel figure img{width:100%;height:100%;object-fit:cover}
.panel .cap{font:500 10.5px/1 var(--mono);color:var(--muted);padding:8px 18px 0}
.panel .cap a{text-decoration:underline}
.panel-bd{padding:16px 18px 0}
.panel-bd h2{font:700 25px/1.06 var(--display);letter-spacing:-.03em}
.pmeta{display:inline-block;font:600 10px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.ptext{font-size:15px;color:var(--muted);line-height:1.55;margin-top:12px}
.act{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}
.marked{font:600 11px/1 var(--mono);color:var(--muted);margin-top:14px}

/* ---------- route view ---------- */
.page-h{font:700 38px/1.02 var(--display);letter-spacing:-.04em;margin-top:22px;text-wrap:balance}
.page-h em{font-style:normal}
.page-lede{color:var(--muted);font-size:15px;margin-top:10px;line-height:1.55}
.stat{display:flex;align-items:center;gap:9px;margin-top:20px;font:600 13px/1.4 var(--mono)}
.stat span{color:var(--muted);font-weight:500}
.bar{height:5px;border-radius:99px;background:var(--line);margin-top:10px;overflow:hidden}
.bar u{display:block;height:100%;border-radius:99px;background:var(--ink);width:var(--p,0%);
  transition:width .6s cubic-bezier(.2,.8,.25,1)}
.days{border-top:1px solid var(--line)}
.day{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;
  padding:14px 2px;border-bottom:1px solid var(--line);transition:background .15s}
.day:active{background:var(--paper-2)}
.day-no{display:grid;place-content:center;width:30px;height:30px;border-radius:8px;background:var(--c);
  color:var(--ink);font:700 13px/1 var(--display);font-variant-numeric:tabular-nums}
.day-dt{display:block;font:500 9.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.day-ti{display:block;font:700 16px/1.25 var(--body);margin-top:6px;letter-spacing:-.015em}
.day-sub{display:block;font:500 11px/1.3 var(--mono);color:var(--muted);margin-top:5px}
.day-km{font:500 11px/1 var(--mono);color:var(--muted);text-align:right;white-space:nowrap;
  font-variant-numeric:tabular-nums;min-width:52px}
.day-km em{display:block;font-style:normal;margin-top:8px;color:var(--ink);font-weight:600}

/* ---------- money / lists ---------- */
.rows{border-top:1px solid var(--line)}
.ledger li{display:flex;align-items:baseline;gap:9px;padding:12px 2px;border-bottom:1px solid var(--line-2)}
.ledger li:last-child{border-bottom:0}
.ledger .l{order:1;font-size:14.5px;color:var(--muted);min-width:0}
.ledger .d{order:2;flex:1;min-width:10px}
.ledger b{order:3;font:600 14px/1.3 var(--mono);white-space:nowrap;font-variant-numeric:tabular-nums}
.ledger .tot{margin-top:4px;padding-top:16px;border-top:2px solid var(--ink);border-bottom:0}
.ledger .tot .l{font:600 10.5px/1.4 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
.ledger .tot b{font:700 25px/1 var(--display);letter-spacing:-.03em}
.chk li{border-bottom:1px solid var(--line-2)}
.chk label{display:flex;gap:12px;align-items:flex-start;padding:13px 2px;cursor:pointer}
.chk input{appearance:none;-webkit-appearance:none;flex:none;width:22px;height:22px;margin:0;border-radius:6px;
  border:1.5px solid var(--btn-edge);display:grid;place-content:center;cursor:pointer;transition:background .15s}
.chk input:checked{background:var(--ink);border-color:var(--ink)}
.chk input:checked:after{content:"";width:4px;height:8px;border:solid var(--paper);border-width:0 2px 2px 0;
  transform:rotate(45deg) translate(-1px,-2px)}
.chk span{font-size:14.5px;color:var(--muted);line-height:1.5}
.chk input:checked+span{color:var(--muted);text-decoration:line-through;opacity:.6}

/* ---------- family photos ---------- */
.crew-line{font-size:13.5px;color:var(--muted);margin:0 0 12px}
.strip-x{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;
  margin:0 -18px;padding:2px 18px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.strip-x::-webkit-scrollbar{display:none}
.shot{flex:0 0 auto;width:62vw;max-width:264px;scroll-snap-align:center}
.shot img{width:100%;height:auto;display:block;border-radius:0;aspect-ratio:4/5;object-fit:cover;background:var(--paper-2)}
.shot figcaption{font:500 10.5px/1.4 var(--mono);color:var(--muted);padding:9px 0 0}

/* ---------- install hint ---------- */
.hintbar{position:fixed;left:12px;right:12px;bottom:calc(var(--tab) + env(safe-area-inset-bottom) + 12px);z-index:65;
  background:var(--ink);color:var(--paper);font:500 13px/1.4 var(--body);border-radius:12px;
  display:flex;align-items:center;gap:10px;padding:12px 14px;max-width:656px;margin:0 auto;
  animation:rise .4s cubic-bezier(.16,.9,.3,1) both}
.hintbar b{font-weight:700}
.hintbar button{margin-left:auto;color:rgba(236,236,230,.6);font-size:19px;line-height:1;padding:2px 4px}

/* ---------- motion ---------- */
@keyframes rise{from{transform:translateY(22px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes drift{from{transform:scale(1) translate3d(0,0,0)}to{transform:scale(1.05) translate3d(0,-1.4%,0)}}
@keyframes rain{from{transform:translate3d(0,-30px,0)}to{transform:translate3d(0,0,0)}}
@keyframes inUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.fresh .band{animation:inUp .45s cubic-bezier(.2,.8,.3,1) both}
.fresh .post-art{animation:fade .6s ease both}
.fresh .prog{animation:inUp .45s cubic-bezier(.2,.8,.3,1) .10s both}

const $=s=>document.querySelector(s);

function toMin(s){
  const m=String(s).match(/^(\d+):(\d+)\s*(AM|PM)$/i);
  if(!m) return s==="Morning"?540:null;
  let h=(+m[1])%12; if(m[3].toUpperCase()==="PM") h+=12;
  return h*60+(+m[2]);
}
function nowIST(){
  const q=new URLSearchParams(location.search).get("now");
  const t=q&&q.match(/^(\d{4})-(\d\d)-(\d\d)T(\d\d):(\d\d)/);
  if(t) return {y:+t[1],mo:+t[2],d:+t[3],min:(+t[4])*60+(+t[5])};
  const p={};
  new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Kolkata",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"})
    .formatToParts(new Date()).forEach(x=>{p[x.type]=x.value;});
  return {y:+p.year,mo:+p.month,d:+p.day,min:(+p.hour)*60+(+p.minute)};
}
function tripDay(n){
  if(n.y!==2026) return 0;
  if(n.mo===10&&n.d>=24&&n.d<=31) return n.d-23;
  if(n.mo===11&&n.d===1) return 9;
  return 0;
}

function stopsOf(i){
  const D=DAYS[i], st=D.stay;
  const list=D.places.map((p,j)=>({k:i+"."+j,n:p.n,d:p.d,q:p.q,t:p.t||"",w:p.w||"",alt:!!p.alt,rl:p.rl||"Reached"}));
  list.push({k:i+".s",n:st.n,d:st.t,q:S.loc[st.sid]||st.q,t:st.at,w:st.w||"",alt:false,rl:st.rl,stay:st});
  return list.map((s,x)=>({s,x,m:s.t?toMin(s.t):null}))
    .sort((a,b)=>((a.s.alt?1:0)-(b.s.alt?1:0))||((a.m===null?9999:a.m)-(b.m===null?9999:b.m))||(a.x-b.x))
    .map(o=>o.s);
}
const isDone=s=>!!S.got[s.k]||!!S.skip[s.k];
const nextStop=i=>{ const L=stopsOf(i); return L.find(s=>!s.alt&&!isDone(s))||null; };
function dayProg(i){ const L=stopsOf(i).filter(s=>!s.alt); return {d:L.filter(isDone).length,n:L.length}; }
function allProg(){ let d=0,n=0; DAYS.forEach((_,i)=>{const p=dayProg(i); d+=p.d; n+=p.n;}); return {d,n}; }

const IMGK="kerala-trip-2026-photos";
let IMG={}; try{ IMG=JSON.parse(localStorage.getItem(IMGK)||"{}"); }catch(e){}
async function photoFor(w){
  const list=(w||"").split("|").filter(Boolean);
  for(const t of list) if(IMG[t]&&IMG[t].s) return IMG[t];
  const need=list.filter(t=>IMG[t]===undefined);
  if(!need.length) return null;
  try{
    const url="https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&prop=pageimages&piprop=thumbnail&pithumbsize=1200&titles="+encodeURIComponent(need.join("|"));
    const j=await (await fetch(url)).json();
    const norm={},redir={},by={};
    (j.query&&j.query.normalized||[]).forEach(x=>norm[x.from]=x.to);
    (j.query&&j.query.redirects||[]).forEach(x=>redir[x.from]=x.to);
    Object.values(j.query&&j.query.pages||{}).forEach(pg=>{ if(pg.thumbnail&&pg.thumbnail.source) by[pg.title]={s:pg.thumbnail.source,p:pg.title}; });
    need.forEach(t=>{ let x=norm[t]||t; x=redir[x]||x; IMG[t]=by[x]||0; });
    try{ localStorage.setItem(IMGK,JSON.stringify(IMG)); }catch(e){}
  }catch(e){}
  for(const t of list) if(IMG[t]&&IMG[t].s) return IMG[t];
  return null;
}

function spineHtml(i){
  const D=DAYS[i], L=stopsOf(i), nx=nextStop(i);
  const planned=L.filter(s=>!s.alt), optional=L.filter(s=>s.alt);
  const rows=planned.map(s=>{
    const st=S.got[s.k]?"done":S.skip[s.k]?"skip":(nx&&nx.k===s.k?"next":"");
    return spineNode(s,i,st,st==="next");
  });
  if(planned.length&&planned.every(isDone)){
    const nd=i<DAYS.length-1?stopsOf(i+1).find(s=>!s.alt):null;
    const last=planned[planned.length-1];
    rows.push(`<li class="sp sp-end">
      <span class="sp-t"></span>
      <span class="sp-rail"><i class="sp-dot">${ICON.star}</i></span>
      <div class="sp-bd">

  }
  return `<ol class="spine" style="--c:${D.c}">${rows.join("")}</ol>`;
}

function stars(n){
  return `<i class="s-on">${"\u2605".repeat(n)}</i><i class="s-off">${"\u2606".repeat(5-n)}</i>`;
}
function extraHtml(i){
  const list=(EXTRAS[AREA_OF[i]]||[]).slice().sort((a,b)=>b.r-a.r);
  if(!list.length) return "";
  return `<h2 class="eye">More around ${esc(AREA_NAME[AREA_OF[i]]||"here")}</h2>
    <p class="hint" style="margin:-2px 0 11px">Rated for a family with a toddler and a baby, not a review score. Tap any row for directions.</p>
    <ol class="xlist">${list.map(x=>`<li class="x">
      <a class="x-go" href="${navUrl(x.q)}" target="_blank" rel="noopener">
        <span class="x-top"><span class="rate" aria-label="${x.r} of 5">${stars(x.r)}</span><b>${esc(x.n)}</b><i class="x-nav">${ICON.go}</i></span>
        <span class="x-d">${esc(x.d)}</span>
      </a></li>`).join("")}</ol>`;
}

/* ======================= weather =======================
   Open-Meteo: free, no API key, no signup, CORS-enabled. One request covers
   every stop, because it accepts comma-separated coordinates. Cached for
   three hours; if the call fails the app simply shows no weather. */
const WXSTORE="kerala-trip-2026-wx";
const WXLOC={mdu:[9.9252,78.1198],mnr:[10.0889,77.0595],alp:[9.4981,76.3388],
             koc:[9.9312,76.2673],slm:[11.6643,78.1460],che:[12.8600,80.0400]};
const WXDAY=["mdu","mnr","mnr","mnr","alp","koc","koc","slm","che"];
const ISO=DAYS.map((_,i)=>new Date(Date.UTC(2026,9,24+i)).toISOString().slice(0,10));
let WX=(()=>{try{return JSON.parse(localStorage.getItem(WXSTORE))||{at:0,d:{}};}catch(e){return {at:0,d:{}};}})();

function wxIcon(c){
  if(c==null) return "";
  if(c>=95) return ICON.storm;
  if((c>=51&&c<=67)||(c>=80&&c<=82)) return ICON.rain;
  if(c>=45&&c<=48) return ICON.cloud;
  if(c>=1&&c<=3) return ICON.partly;
  return ICON.sun;
}
function wxWord(c){
  if(c==null) return "";
  if(c>=95) return "Thunderstorms";
  if(c>=80) return "Showers";
  if(c>=51) return "Rain";
  if(c>=45) return "Mist";
  if(c>=3) return "Cloudy";
  if(c>=1) return "Partly sunny";
  return "Clear";
}
function wxSky(i){
  const w=WX&&WX.d&&WX.d[ISO[i]];
  if(!w||w.c==null) return "";
  if(w.c>=51) return " wx-rain";                      /* drizzle through thunder */
  if(w.c===3||(w.c>=45&&w.c<=48)) return " wx-grey";  /* overcast or mist */
  return "";                                          /* clear: let it look calm */
}
function wxHtml(i){
  const w=WX&&WX.d&&WX.d[ISO[i]];
  if(!w||w.hi==null) return "";
  const wet=w.p!=null&&w.p>=60;
  const rain=w.p!=null?`<em>\u00b7</em><em>${w.p}% rain</em>`:"";
  return `<span class="wx${wet?" wet":""}" title="${esc(wxWord(w.c))}">${wxIcon(w.c)}<b>${w.hi}\u00b0</b><em>/ ${w.lo}\u00b0</em>${rain}</span>`;
}
async function wxLoad(){
  const stale=!WX.at||Date.now()-WX.at>3*36e5;
  const missing=ISO.some(d=>!WX.d[d]);
  if(!stale&&!missing) return false;
  try{
    const ks=Object.keys(WXLOC);
    const u="https://api.open-meteo.com/v1/forecast?latitude="+ks.map(k=>WXLOC[k][0]).join(",")
      +"&longitude="+ks.map(k=>WXLOC[k][1]).join(",")
      +"&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max"
      +"&timezone=Asia%2FKolkata&start_date="+ISO[0]+"&end_date="+ISO[ISO.length-1];
    const r=await fetch(u,{cache:"no-store"});
    if(!r.ok) return false;
    const j=await r.json();
    const arr=Array.isArray(j)?j:[j];
    const d={};
    DAYS.forEach((D,i)=>{
      const e=arr[ks.indexOf(WXDAY[i])];
      if(!e||!e.daily) return;
      const x=e.daily.time.indexOf(ISO[i]);
      if(x<0) return;
      d[ISO[i]]={hi:Math.round(e.daily.temperature_2m_max[x]),lo:Math.round(e.daily.temperature_2m_min[x]),
                 p:e.daily.precipitation_probability_max[x],c:e.daily.weather_code[x]};
    });
    if(!Object.keys(d).length) return false;
    WX={at:Date.now(),d};
    localStorage.setItem(WXSTORE,JSON.stringify(WX));
    return true;
  }catch(e){ return false; }
}

/* ======================= boot ======================= */
let TAB="day", VD=0, lastAnim="";
function render(keep){
  const y=keep?window.scrollY:0;
  const n=nowIST(), td=tripDay(n);
  document.documentElement.style.setProperty("--day", DAYS[VD].c);
  $("#rail").innerHTML=railHtml();
  $("#avnum").textContent=VD+1;
  $("#greetsub").textContent=(TAB==="day")?"":td?("Day "+td+" of nine · "+DAYS[VD].title)
    :(td===0&&n.y===2026&&(n.mo<10||(n.mo===10&&n.d<24))?"Getting ready · "+DAYS[VD].date
    :DAYS[VD].dow+" "+DAYS[VD].date+" · "+DAYS[VD].title);
  $("#view").classList.remove("fresh");
  $("#view").innerHTML = TAB==="day"?viewDay():TAB==="route"?viewRoute():viewInfo();
  /* Only the first paint of a day or tab animates. Marking a stop re-renders
     constantly, and replaying the entrance every time would be maddening. */
  const animKey=TAB+":"+VD;
  if(animKey!==lastAnim){
    lastAnim=animKey; void $("#view").offsetWidth; $("#view").classList.add("fresh");
    const rail=$("#rail"), on=rail.querySelector('[aria-current="true"]');
    if(on) rail.scrollLeft=Math.max(0, on.offsetLeft - rail.clientWidth/2 + on.offsetWidth/2);
  }
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===TAB)));
  $(".rail").style.display = TAB==="day"?"":"none";
  if(keep) window.scrollTo(0,y); else window.scrollTo(0,0);
}

document.addEventListener("click",e=>{
  /* Tapping the tick on a finished row un-marks it right there. That is the
     gesture people reach for, and it saves a pointless trip into the sheet. */
  const node=e.target.closest(".sp");
  if(node&&e.target.closest(".sp-dot")){
    const k=node.dataset.v;
    if(S.got[k]||S.skip[k]){
      delete S.got[k]; delete S.skip[k]; save();
      try{navigator.vibrate&&navigator.vibrate(12);}catch(x){}
      render(true);
      return;
    }
  }
  const el=e.target.closest("[data-go]"); if(!el) return;
  const a=el.dataset.go, v=el.dataset.v;
  if(a==="day"){ VD=+v; TAB="day"; render(false); return; }
  if(a==="open"){ openSheet(v); return; }
  if(a==="close"){ closeSheet(); return; }
  if(a==="got"){ S.got[v]=Date.now(); delete S.skip[v]; try{navigator.vibrate&&navigator.vibrate(18);}catch(x){} }
  else if(a==="skip"){ S.skip[v]=1; delete S.got[v]; }
  else if(a==="undo"){ delete S.got[v]; delete S.skip[v]; }
  else if(a==="edit"){
    const st=DAYS.map(D=>D.stay).find(s=>s.sid===v);
    const r=prompt("Name or address to open in Google Maps",S.loc[v]||st.q);
    if(r!==null&&r.trim()) S.loc[v]=r.trim(); else return;
  }
  else if(a==="reset"){ if(!confirm("Clear every reached, skipped and checklist mark?")) return; S.got={};S.skip={};S.chk={}; }
  save();
  if(openKey&&["got","skip","undo"].includes(a)) openSheet(openKey);
  render(true);
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.matches&&t.matches(".chk input")){ S.chk[t.dataset.k]=t.checked; save(); }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeSheet(); });
window.addEventListener("popstate",()=>{ if(openKey) closeSheet(); });
document.addEventListener("visibilitychange",()=>{
  if(document.hidden) return;
  wxLoad().then(ok=>{ if(ok&&!openKey) render(true); });
});

(function init(){
  const n=nowIST(), td=tripDay(n);
  VD = td ? td-1 : ((n.y>2026||(n.y===2026&&n.mo>=11))?8:0);
  const wantTab=new URLSearchParams(location.search).get("tab");
  if(["day","route","info"].includes(wantTab)) TAB=wantTab;
  document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>{TAB=b.dataset.tab;render(false);}));
  render(false);
  wxLoad().then(ok=>{ if(ok) render(true); });
  if(VD===0||td===0){ const sel=document.querySelector('.chip[aria-current="true"]'); if(sel) sel.scrollIntoView({inline:"center",block:"nearest"}); }
  try{ if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)) navigator.serviceWorker.register("sw.js"); }catch(e){}
  try{
    const ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
    if(ios&&!navigator.standalone&&!localStorage.getItem("kerala-hint")){
      const bar=document.createElement("div");
      bar.className="hintbar";
      bar.innerHTML='<span>Install: tap Share, then <b>Add to Home Screen</b>.</span><button aria-label="Dismiss">×</button>';
      bar.querySelector("button").onclick=()=>{ try{localStorage.setItem("kerala-hint","1");}catch(e){} bar.remove(); };
      document.body.appendChild(bar);
    }
  }catch(e){}
})();
</script>
